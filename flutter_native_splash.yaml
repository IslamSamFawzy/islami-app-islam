flutter_native_splash:
  # Dark app end-to-end — match AppColors.backgroundColor (#202020) so there is
  # no white flash before the splash on a cold start.
  color: "#202020"
  image: assets/images/logo_splsh.png
  color_dark: "#202020"
  image_dark: assets/images/logo_splsh.png

  android_12:
    image: assets/images/logo_splsh.png
    icon_background_color: "#202020"
    image_dark: assets/images/logo_splsh.png
    icon_background_color_dark: "#202020"

  web: false
